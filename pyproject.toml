[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "disagreement-as-error-signal"
version = "0.1.0"
description = "Explainer disagreement as a label-free per-instance predictor of model error, with a calibrated distrust threshold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amna Raheeba" }]

[tool.setuptools]
packages = ["disagreement_signal"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
